<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Manager</title>
	<script type="text/javascript" src="js/code.js?v=20260507-0218" defer></script>
	<link href="css/styles.css?v=20260507-0220" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Ubuntu:400,500,700" rel="stylesheet">
</head>
<body>
	<main class="page-shell">
		<header class="card top-bar">
			<div>
				<h1 class="title left">Contact Manager</h1>
				<p id="userName" class="subtitle left"></p>
			</div>
			<button id="logoutButton" type="button" class="secondary-button">Log Out</button>
		</header>

		<section class="card manager-grid">
			<div class="column">
				<h2>Search Contacts</h2>
				<div class="search-group">
					<input type="text" id="searchText" placeholder="Search by name, phone, or email">
					<button id="searchContactButton" type="button" class="primary-button">Search</button>
				</div>
				<p id="contactSearchResult" class="status-text" aria-live="polite"></p>
				<div id="searchDropdown" class="dropdown hidden"></div>

				<div id="editPanel" class="edit-panel hidden">
					<h2>Edit Contact</h2>
					<form id="editContactForm" class="stack-form">
						<label for="editFirstName">First Name</label>
						<input type="text" id="editFirstName" placeholder="First name" required>

						<label for="editLastName">Last Name</label>
						<input type="text" id="editLastName" placeholder="Last name" required>

						<label for="editPhone">Phone Number</label>
						<input type="text" id="editPhone" placeholder="Phone number">

						<label for="editEmail">Email</label>
						<input type="email" id="editEmail" placeholder="Email address">

						<div class="edit-actions">
							<button id="saveEditButton" type="submit" class="primary-button" disabled>Save Changes</button>
							<button id="cancelEditButton" type="button" class="secondary-button">Cancel</button>
						</div>
					</form>
					<p id="contactEditResult" class="status-text" aria-live="polite"></p>
				</div>
			</div>

			<div class="column">
				<h2>Add Contact</h2>
				<form id="addContactForm" class="stack-form">
					<input type="text" id="addFirstName" placeholder="First name" required>
					<input type="text" id="addLastName" placeholder="Last name" required>
					<input type="text" id="addPhone" placeholder="Phone number">
					<input type="email" id="addEmail" placeholder="Email address">
					<button type="submit" class="primary-button">Add Contact</button>
				</form>
				<p id="contactAddResult" class="status-text" aria-live="polite"></p>
			</div>
		</section>
	</main>
</body>
</html>
